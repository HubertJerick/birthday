<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 18th Birthday!🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        h1 {
            color: #ff4a7d;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .btn {
            background: linear-gradient(135deg, #ff4a7d 0%, #e60042 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 74, 125, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(255, 74, 125, 0.6);
        }

        /* Floating Confetti Particle Styles */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ff0;
            opacity: 0.8;
            top: -10px;
            border-radius: 50%;
            animation: fall linear forwards;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🎂</div>
        <h1>Happy 18th Birthday!</h1>
        <p id="birthday-message">Happy 18th birthday! Wishing you the best today and always!  Saken nalang tong fan mo ha.... wala ng bawian hihihi ✨</p>
        <button class="btn" onclick="celebrate()">Celebrate! 🎉</button>
    </div>

    <script>
        function celebrate() {
            // Change message text dynamically when button is clicked
            document.getElementById('birthday-message').innerHTML = "Sana maging mabait kana hihihi 🎈❤️";
            
            // Create a burst of confetti particles
            for (let i = 0; i < 50; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            // Randomize position, size, colors, and fall speeds
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.opacity = Math.random();
            
            const colors = ['#ff4a7d', '#ffca28', '#42a5f5', '#66bb6a', '#ab47bc'];
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            if (Math.random() > 0.5) {
                confetti.style.borderRadius = '0%'; // Square shapes
            }

            document.body.appendChild(confetti);

            // Clean up elements after animation ends
            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }
    </script>
</body>
</html>
